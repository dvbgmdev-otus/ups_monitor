name: 'Release'

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check release version
        id: release_version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION="$(cmake -P cmake/print_project_version.cmake)"

          if [[ -z "$CMAKE_VERSION" ]]; then
            echo "Project version not found" >&2
            exit 1
          fi

          echo "Tag version: $PACKAGE_VERSION"
          echo "CMake version: $CMAKE_VERSION"

          if [[ "$PACKAGE_VERSION" != "$CMAKE_VERSION" ]]; then
            echo "Release tag does not match CMake project version" >&2
            exit 1
          fi

          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./prj build

      - name: Tests
        run: ./prj test

      - name: Package
        run: ./prj pack

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./build/ups_monitor-${{ steps.release_version.outputs.package_version }}-Linux.deb

  docs:
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: true

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        working-directory: doxygen
        run: doxygen Doxyfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./doxygen/html

      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 15
        uses: actions/deploy-pages@v5
